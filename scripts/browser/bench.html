<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-models real-browser bench</title>
<style>body{margin:0;background:#1f2125;color:#eee;font:13px system-ui}#app{padding:40px;display:flex;justify-content:center}#out{position:fixed;inset:0;background:#111;color:#0f0;font:12px ui-monospace,monospace;white-space:pre;padding:16px;overflow:auto;z-index:99}#log{position:fixed;bottom:0;left:0;right:0;background:#000;color:#ff0;font:11px ui-monospace,monospace;padding:6px;z-index:100;display:none}</style>
</head>
<body>
<div id="app"></div>
<pre id="out"></pre>
<div id="log"></div>
<script src="./react.js"></script>
<script src="./react-dom.profiling.js"></script>
<script>
// Real-browser harness for the shipped lib/client.js. Loads the plugin through
// its own loader entry, mounts ModelPicker against a directory shaped like the
// live one, and times the interactions a user waits on with performance.now()
// plus a React.Profiler. Deliberately independent of jsdom so the numbers are
// the browser's own.
(async () => {
  localStorage.clear()
  const out = []
  const say = (s) => { out.push(s); document.getElementById('out').textContent = out.join('\n') }

  const NAMES = ['a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s']
  const COUNTS = [70,34,31,24,18,14,13,12,10,9,9,8,6,5,4,3,3,2,1]
  const REASONING = { defaultEffort:'high', efforts:[{id:'low',name:'Low',description:'quick'},{id:'medium',name:'Medium',description:'balanced'},{id:'high',name:'High',description:'thorough'}] }
  const GROUPS = NAMES.map((id, pi) => ({
    id, name: 'P' + id,
    models: Array.from({length: COUNTS[pi]}, (_, mi) => ({ id: id+'-'+mi, name: 'M '+id+mi, description: 'desc '+mi, reasoning: REASONING })),
  }))
  const TOTAL = GROUPS.reduce((n,g)=>n+g.models.length,0)
  const factsRows = GROUPS.flatMap(g => g.models.map(m => ({ provider:g.id, id:m.id, contextWindow:128000, input:['text','image'] })))
  const snapshot = { current:{provider:'a',model:'a-3',reasoningEffort:'high'}, routable:null, groups:GROUPS, failures:[], status:'ready', error:null }

  let subscribeCalls = 0, unsubscribeCalls = 0, loadCalls = 0
  const store = {
    subscribe(fn){ subscribeCalls++; return () => { unsubscribeCalls++ } },
    getSnapshot: () => snapshot,
  }
  const origFetch = window.fetch
  window.fetch = async (url) => {
    const u = String(url)
    if (u.includes('/api/model-picker/subagent')) return new Response(JSON.stringify({ok:true,route:null}),{status:200,headers:{'content-type':'application/json'}})
    return new Response(JSON.stringify({ok:true,rows:factsRows,discovered:[]}),{status:200,headers:{'content-type':'application/json'}})
  }

  const React = window.React
  const { createRoot } = window.ReactDOM
  const h = React.createElement

  let plugin = null
  window.__ModuleLoader__ = { load({ factory }) { plugin = factory((name) => { if (name === 'react') return React; throw new Error('unexpected require '+name) }) } }
  const variant = new URLSearchParams(location.search).get('v') || 'after'
  const srcFile = variant === 'before' ? './client-before.js' : './client.js'
  say('variant: ' + variant + ' (' + srcFile + ')')
  const src = await (await origFetch(srcFile)).text()
  // eslint-disable-next-line no-eval
  ;(0, eval)(src)
  if (!plugin || typeof plugin.apply !== 'function') { say('plugin did not load'); return }

  const captured = {}
  const slots = { inject(s, fn){ return fn() }, register(spec, Component){ captured[spec.name] = { spec, Component }; return () => {} } }
  plugin.apply({
    inject(n, cb){ return cb({ locale:{ getSnapshot:()=>({active:'zh'}), subscribe:()=>()=>{} }, slots,
      modelDirectories:{ directoryFor:()=>({ store, load: async()=>{ loadCalls++ }, select: async()=>{} }) },
      sessions:{ subagentAddress:()=>undefined }, remote:{}, 'remote.session':{} }) },
    slots,
    effect(fn){ const d = fn(); return typeof d === 'function' ? d : undefined },
  })
  const seat = captured['conversation.input.model']
  if (!seat) { say('seat not registered'); return }
  const Comp = seat.Component
  const props = seat.spec.inject('bench-sess')

  let commits = 0, renderMs = 0
  const onRender = (id, phase, actualDuration) => { commits++; renderMs += actualDuration }
  const root = createRoot(document.getElementById('app'))

  const marks = []
  const timeIt = async (label, fn) => {
    const runs = []
    for (let i = 0; i < 7; i++) {
      const t0 = performance.now()
      await fn()
      runs.push(performance.now() - t0)
    }
    runs.sort((a,b)=>a-b)
    marks.push({ label, median: runs[3], min: runs[0], max: runs[6] })
  }
  // flushSync commits synchronously, so the measurement is React's own work
  // rather than the next animation frame (a 2-rAF wait floors every number at
  // ~33ms and hides the differences that matter).
  const { flushSync } = window.ReactDOM
  const reactCommit = () => {}
  const sync = (fn) => flushSync(fn)
  const setInput = (el, v) => { const s = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set; s.call(el, v); el.dispatchEvent(new Event('input',{bubbles:true})) }
  const wait = (ms) => new Promise(r => setTimeout(r, ms))

  say(`dsh-models real-browser bench — ${GROUPS.length} providers / ${TOTAL} models`)

  const t0 = performance.now()
  root.render(h(React.Profiler, { id:'picker', onRender }, h(Comp, { ...props, locked:false })))
  await reactCommit()
  marks.push({ label:'mount (trigger only)', median: performance.now()-t0, min:0, max:0 })
  await wait(80)

  // open popup
  await timeIt('open popup (grouped list)', async () => {
    const trg = document.querySelector('.dsh-mp2-triggerLeft')
    trg.click(); await wait(10)
    trg.click(); await wait(10)          // ensure closed
    sync(() => trg.click()); await wait(10)
  })
  const rowsInDom = document.querySelectorAll('.dsh-mp2-list .dsh-mp2-option').length
  say(`rows in DOM: ${rowsInDom}`)

  // keystroke (debounce already settles inside the 380ms window)
  await timeIt('keystroke → filtered (incl. 300ms debounce)', async () => {
    setInput(document.querySelector('.dsh-mp2-search'), 'm 1')
    await wait(340)
    sync(() => {})                       // commit whatever the debounce queued
  })

  await timeIt('clear query (incl. 300ms debounce)', async () => {
    setInput(document.querySelector('.dsh-mp2-search'), '')
    await wait(340)
    sync(() => {})
  })

  // arrow cursor
  await timeIt('arrow key → cursor moves', async () => {
    sync(() => document.querySelector('.dsh-mp2-search').dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true})))
  })

  // scroll
  await timeIt('scroll → spy updates', async () => {
    const l = document.querySelector('.dsh-mp2-list')
    l.scrollTop = 600 + Math.random()*400
    sync(() => l.dispatchEvent(new Event('scroll')))
  })

  // favorite toggle
  await timeIt('favorite toggle', async () => {
    sync(() => document.querySelector('.dsh-mp2-option .dsh-mp2-star').click())
  })

  // close/open cycle = the reopen cost a user feels most often
  await timeIt('close + reopen', async () => {
    const trg = document.querySelector('.dsh-mp2-triggerLeft')
    trg.click(); await wait(10)
    sync(() => trg.click()); await wait(10)
  })

  say('')
  say('interaction'.padEnd(32) + 'median'.padStart(10) + 'min'.padStart(9) + 'max'.padStart(9))
  for (const m of marks) say(m.label.padEnd(32) + (m.median.toFixed(2)+'ms').padStart(10) + (m.min.toFixed(2)+'ms').padStart(9) + (m.max.toFixed(2)+'ms').padStart(9))
  say('')
  say(`store subscribe/unsubscribe: ${subscribeCalls} / ${unsubscribeCalls}`)
  say(`directory.load() calls: ${loadCalls}`)
  say(`React commits: ${commits}, cumulative render: ${renderMs.toFixed(1)}ms`)
  const mem = performance.memory ? ` | JS heap: ${(performance.memory.usedJSHeapSize/1048576).toFixed(1)}MB` : ''
  say(`DOM nodes total: ${document.getElementsByTagName('*').length}${mem}`)
  window.__BENCH__ = { marks, subscribeCalls, unsubscribeCalls, loadCalls, commits, renderMs, rowsInDom }
})().catch(e => { document.getElementById('out').textContent = 'ERROR: ' + (e && e.stack || e) })
</script>
</body>
</html>
